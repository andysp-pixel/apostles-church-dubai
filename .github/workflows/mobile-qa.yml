name: Mobile website checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static and interaction checks
        run: |
          node scripts/check.mjs
          node scripts/check-live.mjs
      - name: Install test-only browsers
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium webkit
      - name: Phone and desktop browser checks
        run: node scripts/check-mobile-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-browser-results
          path: test-results/mobile/
